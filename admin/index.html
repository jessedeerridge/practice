<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuko Wordlog（学生管理）</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#d9dee8;--accent:#111827;--danger:#b42318}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:5;background:rgba(246,247,251,.94);border-bottom:1px solid var(--line)}
    .wrap{max-width:1100px;margin:auto;padding:14px 16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{flex:1}
    h1{font-size:18px;margin:0} button,input,textarea{font:inherit} button{border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)} button.active{background:#2563eb}
    main{max-width:1100px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .cardHead{padding:14px;border-bottom:1px solid var(--line)}.cardBody{padding:14px}.muted{color:var(--muted);font-size:13px}
    .grades{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.grades button{min-width:62px}
    .tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid var(--line);text-align:center;white-space:nowrap}th{font-size:12px;color:var(--muted)}td.left{text-align:left}
    tr.student{cursor:pointer}tr.student:hover{background:#f8fafc}.pct{font-weight:900}.good{color:#16803a}.mid{color:#b54708}.bad{color:#b42318}
    th.quizHead{padding:5px 3px;font-size:10px}.quizCell{min-width:68px;padding:4px 3px;font-size:10px;line-height:1.2}.quizCell .quizPct,.quizCell .quizMeta{font-size:10px}.quizCell .quizPct{font-weight:900}.quizCell .quizMeta{color:var(--muted)}.quizEmpty{color:#98a2b3}
    dialog{width:min(850px,calc(100% - 24px));border:1px solid var(--line);border-radius:16px;padding:0}dialog::backdrop{background:rgba(0,0,0,.45)}
    .login{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.46);display:grid;place-items:center;padding:16px}.loginCard{width:min(460px,100%);background:#fff;border-radius:16px;padding:18px}
    label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:130px;resize:vertical;line-height:1.6}.error{color:var(--danger);min-height:20px}.importCard{margin-top:14px}.importActions{margin-top:10px}.success{color:#16803a;font-weight:800}

  </style>
</head>
<body>
  <header><div class="wrap row"><h1>Yuko Wordlog — 学生管理</h1><div class="space"></div><span id="authState" class="muted">未ログイン</span><button id="logout" class="secondary" hidden>ログアウト</button></div></header>
  <main>
    <div class="grades" id="grades" aria-label="学年"></div>
    <section class="card"><div class="cardHead row"><strong id="title">Ⅰ 学生一覧</strong><div class="space"></div><button id="reload" class="secondary">再読み込み</button></div>
      <div class="cardBody"><p class="muted">本体からFirebaseへ保存された各課のpre1・pre2達成度を表示します。学年・課・単語の構成は管理画面から変更できません。</p><div id="message" class="muted">ログインしてください。</div>
        <div class="tableWrap"><table><thead><tr id="studentHead"></tr></thead><tbody id="students"></tbody></table></div>
      </div>
    </section>
    <section class="card importCard"><div class="cardHead"><strong id="importTitle">Ⅰ 達成度入力</strong></div>
      <div class="cardBody"><p id="importHelp" class="muted">学生1人につき1行で、名前に続けて各課のpre1・pre2を順番に入力してください。最後の総達成度は省略でき、入力してもDBには各課の値から自動計算されます。</p><div id="importOrder" class="muted"></div>
        <label for="bulkInput">達成度データ（複数行可）</label><textarea id="bulkInput" placeholder="王・100%・100%・100%・100%・100%・100%・100%・100%・100%・100%・100%・100%・0%・0%・0%・0%・100%"></textarea>
        <div class="row importActions"><button id="saveBulk" type="button">選択中のクラスへ書き込む</button><button id="copyQuizData" class="secondary" type="button" hidden>小テストデータをコピー</button><span id="importMessage" class="muted" role="status"></span></div>
      </div>
    </section>
  </main>
  <dialog id="detail"><div class="cardHead row"><strong id="detailTitle">学生詳細</strong><div class="space"></div><button id="closeDetail" class="secondary">閉じる</button></div><div class="cardBody tableWrap"><table><thead><tr><th>課</th><th>pre1</th><th>pre2</th></tr></thead><tbody id="lessonRows"></tbody></table></div></dialog>

    function selectView(view){selectedGrade=view;importMessage.textContent="";renderGrades();renderStudents();renderImportGuide();if(dataReady)loadViewData(view)}
    function renderGrades(){grades.innerHTML="";Object.entries(COURSE).forEach(([id,cfg])=>{const b=document.createElement("button");b.textContent=cfg.label;b.className=Number(id)===selectedGrade?"active":"";b.onclick=()=>selectView(Number(id));grades.appendChild(b)});for(const [view,label] of [["quiz","小テスト"],["basicQuiz","小テスト（基礎）"],["kana","かなテスト"]]){const button=document.createElement("button");button.textContent=label;button.className=selectedGrade===view?"active":"";button.onclick=()=>selectView(view);grades.appendChild(button)}}
    let quizExportText="";
    function renderImportGuide(){
      const card=document.querySelector(".importCard");card.hidden=selectedGrade==="kana"||selectedGrade==="basicQuiz";if(card.hidden)return;

    function parsePercent(raw){const text=String(raw??"").trim().replace(/[％%]$/,"").trim();if(!/^\d+(?:\.\d+)?$/.test(text))return null;const value=Number(text);return Number.isFinite(value)&&value>=0&&value<=100?value:null}
    function parseImportLine(line,lineNumber){const parts=String(line).split("・").map(v=>v.trim());const isQuiz=selectedGrade==="quiz",required=isQuiz?QUIZ_COLUMNS.length:COURSE[selectedGrade].lessons.length*2;if(parts.length!==required+1&&(isQuiz||parts.length!==required+2))throw new Error(`${lineNumber}行目: 名前の後に達成度を${required}個${isQuiz||parts.length===required+2?"":"（総達成度を含める場合は最後に1個追加）"}入力してください。`);const name=parts.shift();if(!name)throw new Error(`${lineNumber}行目: 名前を入力してください。`);const values=parts.splice(0,required).map((v,i)=>{const parsed=parsePercent(v);if(parsed===null)throw new Error(`${lineNumber}行目: ${i+1}番目の達成度「${v}」は0〜100%で入力してください。`);return parsed});if(parts.length&&parsePercent(parts[0])===null)throw new Error(`${lineNumber}行目: 総達成度は0〜100%で入力してください。`);return{name,values}}
    async function saveBulkProgress(){importMessage.className="muted";importMessage.textContent="入力内容を確認しています…";const lines=bulkInput.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(!lines.length){importMessage.textContent="データを1行以上入力してください。";return}let rows;try{rows=lines.map((line,i)=>parseImportLine(line,i+1))}catch(e){importMessage.textContent=e.message;return}const view=selectedGrade,now=Date.now(),patch={};for(const row of rows){const studentKey=Object.entries(studentsRoot).find(([,student])=>String(student?.name||"").trim()===row.name)?.[0]||`name_${safeKey(row.name)}`;patch[`students/${studentKey}/studentKey`]=studentKey;patch[`students/${studentKey}/name`]=row.name;if(view!=="quiz")patch[`students/${studentKey}/lastGrade`]=view;patch[`students/${studentKey}/lastSeenAt`]=now;if(view==="quiz"){QUIZ_COLUMNS.forEach((column,i)=>{const id=`admin_override_${i}`;patch[`students/${studentKey}/quizResults/${id}`]={id:`${studentKey}_${id}`,name:row.name,mode:column.mode,conjugation:column.conjugation,percent:row.values[i],achievedAt:now,reason:"admin-edit"}})}else COURSE[view].lessons.forEach((lesson,i)=>["pre1","pre2"].forEach((stage,j)=>{const base=`bestProgress/${studentKey}/${selectedGrade}/${lesson}/${stage}`,value=row.values[i*2+j];patch[`${base}/bestPct`]=value;patch[`${base}/bestAt`]=now;patch[`${base}/lastPct`]=value;patch[`${base}/lastAt`]=now}))}saveBulk.disabled=true;importMessage.textContent="DBへ書き込み中…";try{await update(ref(db),patch);importMessage.className="success";importMessage.textContent=`${rows.length}人分を${view==="quiz"?"小テスト":`クラス${COURSE[view].label}`}へ書き込みました。`;await loadStudents()}catch(e){importMessage.className="error";importMessage.textContent=`書き込み失敗: ${e.message}`}finally{saveBulk.disabled=false}}
    function quizTypeKey(row){return `${row?.mode||""}\u0000${row?.conjugation||""}`}
    function quizDate(value){if(!value)return"--";const date=new Date(value);return`${String(date.getFullYear()).slice(-2)}/${date.getMonth()+1}/${date.getDate()}`}
    function renderQuizResults(){const basic=selectedGrade==="basicQuiz",columns=basic?BASIC_QUIZ_COLUMNS:QUIZ_COLUMNS;title.textContent=basic?"小テスト（基礎）":"小テスト";students.innerHTML="";studentHead.innerHTML=`<th class="left quizHead">名前</th>${columns.map(item=>`<th class="quizHead">${esc(item.label)}</th>`).join("")}`;const legacyRows=Object.values(quizRoot||{}).flatMap(person=>Object.values(person||{}));const studentRows=Object.values(studentsRoot||{}).flatMap(student=>Object.values(student?.quizResults||{}));const byId=new Map([...legacyRows,...studentRows].filter(row=>row&&typeof row==="object"&&row.name).map(row=>[row.id||`${row.name}_${row.mode}_${row.conjugation}_${row.achievedAt}`,row]));const grouped=new Map;for(const rawResult of byId.values()){const aliases={"ショッピングモールへ行く":"買いもの","大学の過ごし方":"大学生活","大学の生活":"大学生活"};const result={...rawResult,mode:aliases[rawResult.mode]||rawResult.mode};if(Number.isInteger(result.homeLevel)&&result.homeLevel!==(basic?0:1))continue;if(!columns.some(column=>quizTypeKey(column)===quizTypeKey(result)))continue;const name=String(result.name);if(!grouped.has(name))grouped.set(name,new Map);const type=quizTypeKey(result),attempts=grouped.get(name).get(type)||[];attempts.push(result);grouped.get(name).set(type,attempts)}const achievementTotals=new Map(Array.from(grouped,([name,results])=>[name,columns.reduce((sum,column)=>{const attempts=results.get(quizTypeKey(column))||[];const latest=attempts.reduce((last,row)=>!last||Number(row.achievedAt||0)>=Number(last.achievedAt||0)?row:last,null);const percent=Number(latest?.percent);return sum+(Number.isFinite(percent)?percent:0)},0)]));const names=Array.from(grouped.keys()).sort((a,b)=>achievementTotals.get(b)-achievementTotals.get(a)||a.localeCompare(b,"ja"));quizExportText=names.map(name=>[name,...columns.map(column=>{const attempts=grouped.get(name).get(quizTypeKey(column))||[];const latest=attempts.reduce((last,row)=>!last||Number(row.achievedAt||0)>=Number(last.achievedAt||0)?row:last,null);const percent=Number(latest?.percent);return Number.isFinite(percent)?percent:0})].join("・")).join("\n");for(const name of names){const results=grouped.get(name),tr=document.createElement("tr");const cells=columns.map(column=>{const attempts=(results.get(quizTypeKey(column))||[]).sort((a,b)=>Number(a.achievedAt||0)-Number(b.achievedAt||0));if(!attempts.length)return '<td class="quizCell quizEmpty">--</td>';const latest=attempts[attempts.length-1],played=attempts.filter(item=>item.reason!=="admin-edit"),likes=played.filter(item=>item.reason==="like"),perfect=played.filter(item=>Number(item.percent)>=100&&item.reason!=="like"),completed=played.filter(item=>Number(item.percent)>=100||item.reason==="like"),firstComplete=completed[0];return `<td class="quizCell"><div class="quizPct ${pctClass(latest.percent)}">${pct(latest.percent)}</div><div class="quizMeta">${quizDate(firstComplete?.achievedAt)}</div><div class="quizMeta" title="完全達成（いいね達成）/ 挑戦回数">${perfect.length}(${likes.length})/${played.length}</div></td>`}).join("");tr.innerHTML=`<td class="left"><strong>${esc(name)}</strong></td>${cells}`;students.appendChild(tr)}message.textContent=names.length?`${names.length}人の最新結果を達成度順に表示しています（完全達成（いいね達成）/ 挑戦回数）。`:"小テストのデータはありません。";if(basic)message.textContent+=" レベル情報のない過去の活用記録には初級の結果も含まれる場合があります。"}
    async function copyQuizData(){
      if(!quizExportText){importMessage.textContent="コピーする小テストデータがありません。";return}
      bulkInput.value=quizExportText;
      try{
        await navigator.clipboard.writeText(quizExportText);

    }
    $("copyQuizData").onclick=copyQuizData;
    function renderKanaResults(){title.textContent="かなテスト";students.innerHTML="";studentHead.innerHTML=`<th class="left quizHead">名前</th>${KANA_STAGES.flatMap(stage=>["ひらがな","カタカナ"].map(script=>`<th class="quizHead">${stage.label}<br>${script}</th>`)).join("")}`;const combined=structuredClone(kanaRoot||{}),seen=new Set;const addAttempt=(studentKey,attempt)=>{if(!attempt||attempt.mode!=="かなテスト"||seen.has(attempt.id))return;seen.add(attempt.id);const key=studentKey||`name_${safeKey(attempt.name||"")}`,data=combined[key]||(combined[key]={name:attempt.name,stages:{}}),stageKey=attempt.conjugation||`${attempt.script}:${attempt.stage}`,old=data.stages[stageKey]||{};if(Number(old.lastAt)>=Number(attempt.achievedAt))return;data.name=data.name||attempt.name;data.stages[stageKey]={bestPct:Math.max(Number(old.bestPct)||0,Number(attempt.percent)||0),count:(Number(old.count)||0)+1,lastAt:Math.max(Number(old.lastAt)||0,Number(attempt.achievedAt)||0)}};for(const [studentKey,attempts] of Object.entries(quizRoot||{}))for(const attempt of Object.values(attempts||{}))addAttempt(studentKey,attempt);for(const [studentKey,student] of Object.entries(studentsRoot||{}))for(const attempt of Object.values(student?.quizResults||{}))addAttempt(studentKey,attempt);const entries=Object.entries(combined).filter(([,data])=>data&&typeof data==="object").sort((a,b)=>String(a[1].name||a[0]).localeCompare(String(b[1].name||b[0]),"ja"));for(const [key,data] of entries){const tr=document.createElement("tr");const cells=KANA_STAGES.flatMap(stage=>["hiragana","katakana"].map(script=>{const result=data.stages?.[`${script}:${stage.key}`];return result?`<td class="quizCell"><div class="quizPct good">${Math.min(3,Number(result.count)||0)}個</div><div class="quizMeta">${quizDate(result.lastAt)}</div></td>`:'<td class="quizCell quizEmpty">--</td>'})).join("");tr.innerHTML=`<td class="left"><strong>${esc(data.name||studentsRoot[key]?.name||key)}</strong></td>${cells}`;students.appendChild(tr)}message.textContent=entries.length?`${entries.length}人のかなテスト達成回数を表示しています。`:"かなテストのデータはありません。"}
    function renderStudents(){if(selectedGrade==="quiz"||selectedGrade==="basicQuiz"){renderQuizResults();return}if(selectedGrade==="kana"){renderKanaResults();return}title.textContent=`${COURSE[selectedGrade].label} 学生一覧`;students.innerHTML="";studentHead.innerHTML=`<th class="left">学生</th>${COURSE[selectedGrade].lessons.map(l=>`<th>${l}課</th>`).join("")}<th>総達成度</th>`;const list=Object.entries(studentsRoot).filter(([key,s])=>bestRoot?.[key]?.[selectedGrade]||progressRoot?.[key]?.[selectedGrade]||Number(s?.lastGrade)===selectedGrade).sort((a,b)=>totalPct(b[0])-totalPct(a[0])||String(a[1]?.name||a[0]).localeCompare(String(b[1]?.name||b[0]),"ja"));
      for(const [key,s] of list){const lessonCells=COURSE[selectedGrade].lessons.map(l=>{const value=lessonPct(key,l);return `<td class="pct ${pctClass(value)}">${pct(value)}</td>`}).join("");const total=totalPct(key),tr=document.createElement("tr");tr.className="student";tr.innerHTML=`<td class="left">${esc(s?.name||key)}</td>${lessonCells}<td class="pct ${pctClass(total)}">${pct(total)}</td>`;tr.onclick=()=>showDetail(key,s);students.appendChild(tr)}
      message.textContent=list.length?`${list.length}人を表示しています。`:"この学年の学生データはありません。"}
    function showDetail(key,s){detailTitle.textContent=`${s?.name||key} / ${COURSE[selectedGrade].label}`;lessonRows.innerHTML="";for(const lesson of COURSE[selectedGrade].lessons){const p1=stagePct(key,lesson,"pre1"),p2=stagePct(key,lesson,"pre2");const tr=document.createElement("tr");tr.innerHTML=`<td>${lesson}</td><td class="pct ${pctClass(p1)}">${pct(p1)}</td><td class="pct ${pctClass(p2)}">${pct(p2)}</td>`;lessonRows.appendChild(tr)}detail.showModal()}
    let dataReady=false,loadRevision=0;
    const viewLoads=new Map();
    function loadViewData(view){
      if(viewLoads.has(view))return viewLoads.get(view);
      const revision=loadRevision;
      const task=(async()=>{
        if(selectedGrade===view)message.textContent="追加データを読み込み中…";
        if(view==="quiz"||view==="basicQuiz"||view==="kana"){
          const paths=view!=="kana"?["quizResults"]:["quizResults","kanaProgress"];
          const results=await Promise.allSettled(paths.map(async path=>{
            const snap=await get(ref(db,path));
            if(revision!==loadRevision)return;
            if(path==="quizResults")quizRoot=snap.exists()?snap.val():{};
            else kanaRoot=snap.exists()?snap.val():{};
            if(selectedGrade===view)renderStudents();
          }));
          if(revision!==loadRevision)return;
          const failedPaths=paths.filter((path,index)=>results[index].status==="rejected");
          if(failedPaths.length)throw new Error(`${failedPaths.join("、")}を取得できませんでした。取得済みの記録のみ表示しています`);
        }else{
          const keys=Object.keys(studentsRoot).filter(key=>!Object.prototype.hasOwnProperty.call(progressRoot[key]||{},view)&&COURSE[view].lessons.some(lesson=>["pre1","pre2"].some(stage=>{
            const value=bestRoot?.[key]?.[view]?.[lesson]?.[stage]?.bestPct;
            return value==null||!Number.isFinite(Number(value));
          })));
          let next=0,completed=0;const failures=[];
          await Promise.all(Array.from({length:Math.min(6,keys.length)},async()=>{
            while(next<keys.length && revision===loadRevision){
              const key=keys[next++];
              try{
                let snap;
                try{snap=await get(ref(db,`progress/${key}/${view}`))}
                catch(firstError){
                  if(revision!==loadRevision)return;
                  await new Promise(resolve=>setTimeout(resolve,300));
                  if(revision!==loadRevision)return;
                  snap=await get(ref(db,`progress/${key}/${view}`));
                }
                if(revision!==loadRevision)return;
                if(!progressRoot[key])progressRoot[key]={};
                progressRoot[key][view]=snap.exists()?snap.val():{};
              }catch(error){failures.push(studentsRoot[key]?.name||key)}
              completed++;
              if(revision===loadRevision&&selectedGrade===view){
                renderStudents();
                message.textContent=`達成度を読み込み中… ${completed}/${keys.length}人${failures.length?`（${failures.length}人取得失敗）`:""}`;
              }
            }
          }));
          if(revision!==loadRevision)return;
          if(failures.length)throw new Error(`${failures.join("、")}の達成度を取得できませんでした`);
        }
        if(revision===loadRevision&&selectedGrade===view)renderStudents();
      })().catch(e=>{
        if(revision!==loadRevision)return;
        viewLoads.delete(view);
        if(selectedGrade===view)message.textContent=`追加データの読み込み失敗: ${e.message}（再読み込みで再試行）`;
      });
      viewLoads.set(view,task);return task;
    }
    async function loadStudents(){
      const revision=++loadRevision;dataReady=false;viewLoads.clear();
      message.textContent="読み込み中…";
      try{
        const [studentsSnap,bestSnap]=await Promise.all([get(ref(db,"students")),get(ref(db,"bestProgress"))]);
        if(revision!==loadRevision)return;
        studentsRoot=studentsSnap.exists()?studentsSnap.val():{};
        bestRoot=bestSnap.exists()?bestSnap.val():{};
        progressRoot={};quizRoot={};kanaRoot={};dataReady=true;
        renderStudents();
        await loadViewData(selectedGrade);
      }catch(e){if(revision===loadRevision)message.textContent=`読み込み失敗: ${e.message}`}
    }
    email.value=localStorage.getItem(ADMIN_EMAIL_KEY)||"";
    loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent="";const loginName=email.value.trim();localStorage.setItem(ADMIN_EMAIL_KEY,loginName);try{await signInWithEmailAndPassword(auth,loginName,password.value)}catch(err){loginError.textContent="ログインできませんでした。"}};
    logout.onclick=()=>signOut(auth);reload.onclick=loadStudents;closeDetail.onclick=()=>detail.close();saveBulk.onclick=saveBulkProgress;
    onAuthStateChanged(auth,user=>{login.style.display=user?"none":"grid";logout.hidden=!user;authState.textContent=user?user.email:"未ログイン";if(user)loadStudents();else{loadRevision++;dataReady=false;viewLoads.clear();studentsRoot={};bestRoot={};progressRoot={};quizRoot={};kanaRoot={};quizExportText="";renderStudents()}});
    renderGrades();renderStudents();renderImportGuide();
